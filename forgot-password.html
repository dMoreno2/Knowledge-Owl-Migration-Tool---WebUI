<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — Knowledge Owl Migration Tool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(51, 51, 51);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgb(3, 15, 47);
            border-radius: 15px;
            padding: 40px;
            width: 380px;
        }
        h2 { color: white; margin-bottom: 10px; font-size: 1.2em; }
        p { color: #aaa; font-size: 0.9em; margin-bottom: 20px; }
        label { color: white; font-size: 0.9em; display: block; margin-bottom: 6px; }
        input[type="email"] {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid rgb(79, 79, 79);
            background: rgb(32, 37, 67);
            color: white;
            margin-bottom: 18px;
            font-size: 0.95em;
        }
        button {
            width: 100%;
            background-color: orange;
            color: black;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover { background-color: #e69500; }
        .back { display: block; margin-top: 14px; color: #aaa; font-size: 0.85em; text-align: center; text-decoration: none; }
        .back:hover { color: white; }
        .success { color: #6bff8e; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reset Password</h2>
        <div id="msg">
            <p>Enter your email address and we'll send you a reset link.</p>
        </div>
        <form id="form" method="POST" action="/forgot-password">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" />
            <button type="submit">Send Reset Link</button>
        </form>
        <a class="back" href="/login">Back to login</a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('sent')) {
            document.getElementById('msg').innerHTML =
                '<p class="success">If that email is registered, a reset link has been sent.</p>';
            document.getElementById('form').style.display = 'none';
        }
    </script>
</body>
</html>
