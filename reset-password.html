<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — Knowledge Owl Migration Tool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(51, 51, 51);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgb(3, 15, 47);
            border-radius: 15px;
            padding: 40px;
            width: 380px;
        }
        h2 { color: white; margin-bottom: 20px; font-size: 1.2em; }
        label { color: white; font-size: 0.9em; display: block; margin-bottom: 6px; }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid rgb(79, 79, 79);
            background: rgb(32, 37, 67);
            color: white;
            margin-bottom: 18px;
            font-size: 0.95em;
        }
        button {
            width: 100%;
            background-color: orange;
            color: black;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover { background-color: #e69500; }
        .back { display: block; margin-top: 14px; color: #aaa; font-size: 0.85em; text-align: center; text-decoration: none; }
        .back:hover { color: white; }
        .error { color: #ff6b6b; font-size: 0.85em; margin-bottom: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Set New Password</h2>
        <div id="msg"></div>
        <form id="form" method="POST" action="/reset-password">
            <input type="hidden" id="token" name="token" />
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" />
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" required minlength="8" autocomplete="new-password" />
            <button type="submit">Set Password</button>
        </form>
        <a class="back" href="/login">Back to login</a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const msg = document.getElementById('msg');

        if (params.get('error')) {
            msg.innerHTML = '<p class="error">This reset link is invalid or has expired.</p>';
            document.getElementById('form').style.display = 'none';
        } else if (!token) {
            msg.innerHTML = '<p class="error">No reset token provided.</p>';
            document.getElementById('form').style.display = 'none';
        } else {
            document.getElementById('token').value = token;
        }

        document.getElementById('form').addEventListener('submit', (e) => {
            const pw = document.getElementById('password').value;
            const cf = document.getElementById('confirm').value;
            if (pw !== cf) {
                e.preventDefault();
                msg.innerHTML = '<p class="error">Passwords do not match.</p>';
            }
        });
    </script>
</body>
</html>
